<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/static/style.css">
    <title>{{ title if title else "Portfolio" }}</title>
</head>
<body>
    <header>
        <nav class="nav-links">
            <a href="/">TOP</a>
            {% if current_user %}
                <span class="nav-group">
                    <span class="nav-user-stack">
                        <a href="/upload">投稿</a>
                        <span class="nav-username">{{ current_user.username|e }} さん</span>
                    </span>
                    <a href="#" id="logout-btn">ログアウト</a>
                </span>
            {% else %}
                <span class="nav-group">
                    <a href="/login">ログイン</a>
                    <a href="/register">新規登録</a>
                </span>
            {% endif %}
        </nav>

        <form action="/search" method="GET" class="search-form">
            <label for="search_query">検索:</label>
            <input
                type="text"
                id="search_query"
                name="search_query"
                placeholder="タイトルで検索"
                value="{{ search_keyword if search_keyword else '' }}"
            >
            <button type="submit">検索</button>
        </form>
    </header>

    <hr>

    {% block content %}{% endblock %}

    {% if current_user %}
    <script>
        document.getElementById('logout-btn').addEventListener('click', async function (e) {
            e.preventDefault();
            await fetch('/auth/logout', {method: 'POST', credentials: 'same-origin'});
            location.href = '/';
        });
    </script>
    {% endif %}
</body>
</html>
