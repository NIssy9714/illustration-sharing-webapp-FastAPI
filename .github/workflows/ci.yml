name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Lint + 単体/結合テスト（in-memory SQLite, TestClient）
  # ============================================================
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SECRET_KEY: ci-secret-key
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      APP_ENV: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      # mypy は段階導入中（continue-on-error 維持）。SQLAlchemy 1.x の Column[T] 型推論問題が
      # 大半で、根本解決には `Mapped[]` (SQLAlchemy 2.0 style) への移行が必要。
      # ruff（lint + format）は厳格にゲート化済み。
      - name: Mypy (type check)
        run: mypy app
        continue-on-error: true

      # E2E は別ジョブで動かすため除外
      # --cov-fail-under=70 でカバレッジゲートを設ける（70% 未満で CI 失敗）
      - name: Pytest with coverage
        run: pytest --ignore=tests/e2e --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70 -q

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Security audit (pip-audit)
        run: pip-audit --strict --ignore-vuln GHSA-4xh5-x5gv-qwph || true

  # ============================================================
  # E2E（Playwright + Chromium、実 uvicorn を別プロセス起動）
  # ============================================================
  e2e-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test

    env:
      # E2E は conftest 側でも上書きするが、フェイルセーフで設定
      SECRET_KEY: e2e-secret-key
      APP_ENV: dev
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          pytest tests/e2e -q \
            --screenshot=only-on-failure \
            --video=retain-on-failure \
            --tracing=retain-on-failure \
            --output=tests/e2e/artifacts

      - name: Upload E2E artifacts (screenshots / videos / traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: tests/e2e/artifacts/
          if-no-files-found: ignore

  # ============================================================
  # API 契約テスト（schemathesis を OpenAPI 仕様に食わせる）
  # ============================================================
  contract-schemathesis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-test

    env:
      SECRET_KEY: contract-test-secret-key
      DATABASE_URL: sqlite:///./contract_test.db
      APP_ENV: dev
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      ALLOWED_ORIGINS: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start uvicorn in background
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > uvicorn.log 2>&1 &
          # /health が 200 を返すまで最大 30 秒待つ
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "server up"
              exit 0
            fi
            sleep 0.5
          done
          echo "uvicorn did not start" >&2
          cat uvicorn.log
          exit 1

      # 認証必須エンドポイントは 401 が想定挙動のため、checks から status_code を除外する
      # OpenAPI 仕様と実 API レスポンス形式の整合性（response schema 違反など）を検出する用途
      - name: Run schemathesis
        run: |
          schemathesis run http://127.0.0.1:8000/openapi.json \
            --experimental=openapi-3.1 \
            --checks=response_schema_conformance,content_type_conformance \
            --hypothesis-max-examples=20 \
            --validate-schema=false \
            --workers=2

      - name: Upload uvicorn log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-server-log
          path: uvicorn.log
          if-no-files-found: ignore
