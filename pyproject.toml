[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["alembic/versions", "static", "templates"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (format で吸収)
    "B008",  # FastAPI の Depends() のためのデフォルト関数呼び出しは許可
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# grant_admin は load_dotenv() を import の間に挟む必要があり、isort/E402 と構造的に競合する
"app/scripts/grant_admin.py" = ["E402", "I001"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = [
    "alembic/",
    "tests/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "e2e: ブラウザ駆動の E2E テスト（pytest-playwright を使用）",
]

[tool.coverage.run]
# 単体実行のユーティリティスクリプトは coverage 対象から外す（運用ツールでテスト価値が低い）
omit = [
    "app/scripts/*",
    "app/generate_thumbs.py",
]
